<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Extratus</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        margin: 0;
        padding: 16px;
        width: 320px;
        background: Canvas;
        color: CanvasText;
      }
      h1 {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 12px;
      }
      .status {
        padding: 10px 12px;
        border-radius: 6px;
        background: rgba(127, 127, 127, 0.1);
        margin-bottom: 12px;
        font-size: 13px;
        line-height: 1.4;
      }
      .status.matched {
        background: rgba(34, 197, 94, 0.12);
      }
      .status.error {
        background: rgba(239, 68, 68, 0.12);
      }
      button {
        width: 100%;
        padding: 10px;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
      }
      button + button {
        margin-top: 8px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <h1>Extratus</h1>
    <div id="status" class="status">Verificando…</div>
    <button id="export-ofx" disabled>Exportar OFX</button>
    <button id="export-csv" disabled>Exportar CSV</button>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
