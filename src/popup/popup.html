<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Extratus</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        margin: 0;
        padding: 16px;
        width: 320px;
        background: Canvas;
        color: CanvasText;
      }
      h1 {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 14px;
      }
      label {
        display: block;
        margin-bottom: 10px;
        font-size: 12px;
        font-weight: 500;
      }
      label span {
        display: block;
        margin-bottom: 4px;
        opacity: 0.7;
      }
      select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid rgba(127, 127, 127, 0.4);
        border-radius: 6px;
        background: Canvas;
        color: inherit;
        font-size: 13px;
      }
      button {
        width: 100%;
        padding: 10px;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        margin-top: 6px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .status {
        margin-top: 12px;
        padding: 8px 10px;
        border-radius: 6px;
        background: rgba(127, 127, 127, 0.1);
        font-size: 12px;
        line-height: 1.4;
        min-height: 18px;
      }
      .status:empty {
        display: none;
      }
      .status.ok {
        background: rgba(34, 197, 94, 0.12);
      }
      .status.error {
        background: rgba(239, 68, 68, 0.12);
      }
      .status .action {
        display: inline-block;
        margin-top: 6px;
        font-size: 12px;
        text-decoration: underline;
        cursor: pointer;
        color: inherit;
      }
      .help-link {
        display: block;
        margin-top: 14px;
        font-size: 12px;
        text-align: center;
        color: inherit;
        opacity: 0.7;
        text-decoration: none;
      }
      .help-link:hover {
        opacity: 1;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>Extratus</h1>
    <label>
      <span>Banco</span>
      <select id="recipe-select"><option>Carregando…</option></select>
    </label>
    <label>
      <span>Período</span>
      <select id="period-select">
        <option value="all" selected>Tudo (~1 ano)</option>
        <option value="month">Último mês</option>
        <option value="last_two_weeks">Últimos 15 dias</option>
        <option value="last_week">Últimos 7 dias</option>
        <option value="yesterday">Ontem</option>
        <option value="today">Hoje</option>
      </select>
    </label>
    <button id="export-ofx">Exportar OFX</button>
    <button id="export-csv">Exportar CSV</button>
    <div id="status" class="status"></div>
    <a id="help-link" class="help-link" href="#" target="_blank">Não tem seu banco? Contribua uma recipe →</a>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
